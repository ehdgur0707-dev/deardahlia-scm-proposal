<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디어달리아 SCM 허브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽 부서별 도구 목록 + 오른쪽 작업 화면. 좁은 화면에선 도구 목록이 위쪽 가로 스크롤로 바뀜 */
:root{
  --bg:#F6F3F2; --surface:#FFFFFF; --surface2:#EFE9E8; --ink:#221C26; --muted:#6A6070; --line:#E2D9DC;
  --accent:#AE3759; --accent-soft:#F7DFE6; --teal:#2A6886; --teal-soft:#DDEBF2;
  --good:#2D7A4E; --good-soft:#DFF1E5; --warn:#9A6200; --warn-soft:#FBEFD3; --bad:#B42318; --bad-soft:#FBE4E1;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131A; --surface:#211B25; --surface2:#2B2430; --ink:#F1ECF2; --muted:#ADA2B2; --line:#3A3140;
  --accent:#E57C9C; --accent-soft:#4A2433; --teal:#7DB7D3; --teal-soft:#1E3642;
  --good:#7ACB98; --good-soft:#1D3A29; --warn:#E8B65A; --warn-soft:#3D2F12; --bad:#F2877C; --bad-soft:#47201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131A; --surface:#211B25; --surface2:#2B2430; --ink:#F1ECF2; --muted:#ADA2B2; --line:#3A3140;
  --accent:#E57C9C; --accent-soft:#4A2433; --teal:#7DB7D3; --teal-soft:#1E3642;
  --good:#7ACB98; --good-soft:#1D3A29; --warn:#E8B65A; --warn-soft:#3D2F12; --bad:#F2877C; --bad-soft:#47201C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;margin:0 0 2px}
.brand-sub{color:var(--muted);font-size:12px;margin:0 0 18px}
.grp{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;font-weight:700}
nav.side a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
nav.side a .code{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px}
nav.side a:hover{background:var(--surface2)}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.side a.on .code{color:var(--accent)}
main{padding-block:20px 48px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.demo-flag{background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
h1{font-size:24px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tw.tall{max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{background:var(--surface2);font-weight:700;font-size:12px;color:var(--muted);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
td.wrap{white-space:normal;min-width:220px}
tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface2)}
tbody tr.sel{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--teal-soft);color:var(--teal)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--surface2);color:var(--muted)}
button,.btn{font:inherit;font-size:13px;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer}
button:hover{background:var(--surface2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.07);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--teal);padding:4px 6px}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input,select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.lin{background:none;border:none;padding:0;font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--teal);text-decoration:underline dotted;cursor:pointer;font-weight:500}
.note{border-left:3px solid var(--teal);padding:6px 12px;color:var(--muted);font-size:13px;background:var(--surface)}
.note.acc{border-color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.steps{padding:0;margin:0}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>div{display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.progress{display:flex;flex-direction:column;gap:6px;font-size:13px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:none}
.detail{margin-top:14px}
#modal{position:fixed;inset:0;background:rgba(20,14,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border-radius:14px;max-width:820px;width:100%;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.mbox header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mbox header h3{margin:0;font-size:16px;flex:1}
.mbody{padding:16px;overflow:auto}
.mbox footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
textarea.out{width:100%;min-height:240px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);padding:10px;resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;max-width:min(560px,calc(100% - 32px));z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.done td{opacity:.5}
.home-grid{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
@media (max-width:1100px){.home-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:none;border-bottom:1px solid var(--line);align-items:center;padding-block:10px}
  nav.side .brand,nav.side .brand-sub,nav.side .grp{display:none}
  nav.side a{white-space:nowrap;flex:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="side" id="nav" aria-label="도구 목록">
    <p class="brand">SCM 허브</p>
    <p class="brand-sub">디어달리아 · 프로토타입</p>
    <a href="#home" data-v="home"><span class="code">◎</span>오늘 현황</a>
    <p class="grp">SCM 물류</p>
    <a href="#collect" data-v="collect"><span class="code">L1</span>재고 수집·검증</a>
    <a href="#ship" data-v="ship"><span class="code">L2</span>출고 유효기간 검사</a>
    <a href="#channel" data-v="channel"><span class="code">L4</span>채널 재고·자산</a>
    <p class="grp">영업</p>
    <a href="#stock" data-v="stock"><span class="code">S1</span>재고 바로보기</a>
    <a href="#hold" data-v="hold"><span class="code">S2</span>보류 요청함</a>
    <a href="#settle" data-v="settle"><span class="code">S3</span>정산 대사·예측</a>
    <p class="grp">구매</p>
    <a href="#buy" data-v="buy"><span class="code">P1</span>발주 추천·부자재</a>
    <p class="grp">회계</p>
    <a href="#close" data-v="close"><span class="code">A1</span>월마감·원가</a>
    <p class="grp">공통</p>
    <a href="#master" data-v="master"><span class="code">M0</span>기준정보</a>
  </nav>
  <main>
    <div class="topbar">
      <div class="meta">
        <span class="demo-flag">가상 데이터 시연</span>
        <span id="clock"></span>
      </div>
      <button id="resetBtn" class="sm">처음 상태로</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle"><header><h3 id="mTitle"></h3><button id="mClose" class="sm">닫기</button></header><div class="mbody" id="mBody"></div><footer id="mFoot"></footer></div></div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
/* ---------- 유틸 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R; const ri=(a,b)=>Math.floor(R()*(b-a+1))+a;
const TODAY=new Date(2026,10,9);
const addMonths=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const p2=n=>String(n).padStart(2,'0');
const fmtD=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const yymm=d=>`${String(d.getFullYear()).slice(2)}${p2(d.getMonth()+1)}`;
const mLeft=d=>(d-TODAY)/(864e5*30.44);
const fmt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ko-KR');
const won=n=>n==null?'—':Math.round(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const $=s=>document.querySelector(s);

let S;
/* ---------- 임의 데이터 생성 ---------- */
function gen(){
  R=mulberry32(20261109);
  S={seq:1104,clock:'09:40',nextCut:'11:00',batches:[],history:[],done:{},sel:null,collectRunAt:'08:30'};
  const V4=['50ml','30ml','미니 10ml','리필'],V3=['200ml','100ml','리필'];
  const LINES=[
    {c:'LT',n:'글로우 틴트',cat:'립',b:'DD',k:10,moq:3000,cost:2100,lt:8,shelf:30,ct:'CT-TINT'},
    {c:'LS',n:'벨벳 립스틱',cat:'립',b:'DD',k:10,moq:3000,cost:3300,lt:10,shelf:30,ct:'CT-STICK'},
    {c:'LP',n:'립 펜슬',cat:'립',b:'DD',k:10,moq:5000,cost:1400,lt:8,shelf:36,ct:'CT-PENCIL'},
    {c:'LG',n:'립 글레이즈',cat:'립',b:'DD',k:10,moq:3000,cost:2400,lt:8,shelf:30,ct:'CT-GLAZE'},
    {c:'LJ',n:'듀 립젤',cat:'립',b:'DD',k:10,moq:3000,cost:2000,lt:8,shelf:30,ct:'CT-JEL'},
    {c:'LB',n:'컬러 립밤',cat:'립',b:'DD',k:10,moq:3000,cost:1700,lt:6,shelf:30,ct:'CT-BALM'},
    {c:'BB',n:'데일리 BB',cat:'베이스',b:'DD',k:5,moq:3000,cost:3800,lt:10,shelf:30,ct:'CT-TUBE'},
    {c:'CU',n:'쿠션 파운데이션',cat:'베이스',b:'DD',k:8,moq:3000,cost:5200,lt:12,shelf:30,ct:'CT-CUSHION'},
    {c:'PR',n:'프라이머',cat:'베이스',b:'DD',k:2,moq:3000,cost:3500,lt:10,shelf:30,ct:'CT-TUBE'},
    {c:'CC',n:'컨실러',cat:'베이스',b:'DD',k:5,moq:3000,cost:2600,lt:8,shelf:30,ct:'CT-WAND'},
    {c:'EP',n:'아이 팔레트',cat:'아이',b:'DD',k:6,moq:2000,cost:6400,lt:12,shelf:36,ct:'CT-PALETTE'},
    {c:'EL',n:'아이라이너',cat:'아이',b:'DD',k:4,moq:5000,cost:1900,lt:8,shelf:24,ct:'CT-LINER'},
    {c:'MS',n:'마스카라',cat:'아이',b:'DD',k:2,moq:3000,cost:2700,lt:8,shelf:24,ct:'CT-MASCARA'},
    {c:'BL',n:'리퀴드 블러쉬',cat:'치크',b:'DD',k:3,moq:3000,cost:2500,lt:8,shelf:30,ct:'CT-WAND'},
    {c:'SR',n:'젤리 세럼',cat:'스킨케어',b:'DD',k:4,v:V4,moq:2000,cost:5600,lt:10,shelf:36,ct:'CT-SERUM'},
    {c:'CR',n:'배리어 크림',cat:'스킨케어',b:'DD',k:4,v:V4,moq:2000,cost:5900,lt:10,shelf:36,ct:'CT-JAR'},
    {c:'MI',n:'젤 미스트',cat:'스킨케어',b:'DD',k:4,v:V4,moq:3000,cost:3600,lt:8,shelf:36,ct:'CT-MIST'},
    {c:'SN',n:'모이스처 선로션',cat:'스킨케어',b:'DD',k:4,v:V4,moq:3000,cost:4200,lt:10,shelf:30,ct:'CT-TUBE'},
    {c:'CL',n:'약산성 클렌저',cat:'스킨케어',b:'OP',k:3,v:V3,moq:3000,cost:3100,lt:8,shelf:36,ct:'CT-PUMP'},
    {c:'TN',n:'카밍 토너',cat:'스킨케어',b:'OP',k:3,v:V3,moq:3000,cost:3400,lt:8,shelf:36,ct:'CT-BOTTLE'},
    {c:'MK',n:'시트 마스크',cat:'스킨케어',b:'OP',k:3,v:['1매','5매','10매'],moq:5000,cost:900,lt:6,shelf:30,ct:'CT-POUCH'},
  ];
  S.skus=[];
  LINES.forEach(L=>{for(let i=1;i<=L.k;i++){const nn=p2(i);const vn=L.v?L.v[i-1]:nn+'호';
    const m=L.cat==='립'?(i<=3?ri(700,1400):ri(90,420)):ri(150,900);
    S.skus.push({sku:`${L.b}-${L.c}-${nn}`,name:`${L.n} ${vn}`,line:L.c,lineName:L.n,cat:L.cat,brand:L.b==='DD'?'디어달리아':'오프라',moq:L.moq,cost:L.cost+ri(-3,3)*50,lt:L.lt,shelf:L.shelf,monthly:m,ct:L.ct,box:`BX-${L.c}${nn}`,label:`LB-${L.c}${nn}`});}});
  S.skuMap=Object.fromEntries(S.skus.map(s=>[s.sku,s]));

  /* 국내 로트 */
  S.lots=[];
  const mkLot=(s,mfg,onhand)=>({lot:`${s.line}${s.sku.slice(-2)}-${yymm(mfg)}`,sku:s.sku,mfg,exp:addMonths(mfg,s.shelf),onhand,qc:0,alloc:0,wmsHold:0,cost:s.cost,row:0});
  const PLANT={'DD-LT-02':1500,'DD-LS-01':1500,'DD-LG-03':1500,'DD-CU-02':1500,'DD-EP-02':120};
  S.skus.forEach(s=>{
    if(PLANT[s.sku]!=null){
      const a=addMonths(TODAY,-(s.shelf-7));a.setDate(ri(1,20));
      S.lots.push(mkLot(s,a,400));
      const b=addMonths(TODAY,-2);b.setDate(ri(1,20));
      S.lots.push(mkLot(s,b,PLANT[s.sku]));return;
    }
    const n=R()<.5?2:3;
    const ages=n===3?[ri(1,3),ri(7,10),ri(13,16)]:[ri(1,4),ri(8,13)];
    ages.forEach((age,j)=>{const d=addMonths(TODAY,-age);d.setDate(ri(1,28));
      const q=Math.round(s.monthly*(j===0?ri(12,32):ri(2,10))/10/10)*10;
      S.lots.push(mkLot(s,d,Math.max(q,30)));});
  });
  S.lots.sort((a,b)=>a.sku<b.sku?-1:a.sku>b.sku?1:a.exp-b.exp);
  S.lots.forEach((l,i)=>l.row=i+2);
  for(let i=0;i<10;i++){const l=S.lots[ri(0,S.lots.length-1)];l.qc=Math.min(l.onhand,ri(2,6)*10);}
  for(let i=0;i<18;i++){const l=S.lots[ri(0,S.lots.length-1)];l.alloc=Math.min(l.onhand-l.qc,ri(1,5)*10);}
  /* 원가 미확정 신규 로트 6개 */
  ['DD-LT-05','DD-LJ-07','DD-BB-03','DD-EL-02','DD-SR-02','OP-TN-01'].forEach((k,i)=>{
    const l=newestLot(k);const d=addDays(TODAY,-(6+i*3));l.mfg=d;l.exp=addMonths(d,S.skuMap[k].shelf);l.lot=`${S.skuMap[k].line}${k.slice(-2)}-${yymm(d)}`;l.cost=null;});

  /* 보류(내부 예약 포함) */
  S.res=[];

/* ---------- L2 출고 검사 ---------- */
function checkOrder(o){
  const ch=S.chMap[o.ch];
  const lots=S.lots.filter(l=>l.sku===o.sku).map(l=>({l,a:lotAvail(l)})).filter(x=>x.a>0).sort((a,b)=>a.l.exp-b.l.exp);
  let need=o.qty;const fefo=[];for(const x of lots){if(need<=0)break;const t=Math.min(need,x.a);fefo.push({lot:x.l,qty:t});need-=t;}
  if(need>0)return{status:'불가',reason:`가용 ${fmt(o.qty-need)}개뿐`,fefo};
  const bad=fefo.filter(p=>mLeft(p.lot.exp)<ch.rule);
  if(!bad.length)return{status:'통과',fefo};
  const ok=lots.filter(x=>mLeft(x.l.exp)>=ch.rule);let n=o.qty;const alt=[];for(const x of ok){if(n<=0)break;const t=Math.min(n,x.a);alt.push({lot:x.l,qty:t});n-=t;}
  if(n<=0)return{status:'로트 지정',fefo,alt,bad};
  return{status:'불가',reason:`규정 충족 로트가 ${fmt(o.qty-n)}개뿐`,fefo,alt,bad,partial:o.qty-n};
}

/* ---------- P1 발주 ---------- */
function buyRows(){
  return S.skus.map(s=>{const fcM=s.fcDom+s.fcOs+s.fcBm;const ltM=s.lt/4.345;const avail=Math.max(0,requestable(s.sku))+osTotal(s.sku);
    const safety=Math.round(fcM*.5);const need=Math.round(fcM*(ltM+1)+safety-avail-s.incoming);
    if(need<=0)return null;const order=Math.max(need,s.moq);const excess=order-need;
    const cover=(avail+s.incoming+order-fcM*ltM)/fcM;const win=s.shelf-9;
    const risk=cover>win?'폐기 위험':cover>win*.75?'주의':'적정';
    const parts=[S.parts[s.ct],S.parts[s.box],S.parts[s.label]].map(p=>({...p,short:Math.max(0,order-p.stock)}));
    const lim=parts.filter(p=>p.short>0).sort((a,b)=>b.lt-a.lt)[0];
    const effLt=lim?lim.lt+s.lt:s.lt;
    return{s,fcM,avail,safety,need,order,excess,cover,win,risk,parts,lim,effLt};}).filter(Boolean)
    .sort((a,b)=>({'폐기 위험':0,'주의':1,'적정':2}[a.risk]-{'폐기 위험':0,'주의':1,'적정':2}[b.risk])||b.excess-a.excess);
}

V.stock=()=>{
  const q=(S.q||'').trim().toLowerCase();const cat=S.cat||'';

    const L=S.lots.filter(l=>l.sku===s.sku);const oh=sum(L,l=>l.onhand),blk=sum(L,l=>l.qc+l.alloc),wh=sum(L,l=>l.wmsHold);const pr=pendingRes(s.sku);const rq=requestable(s.sku);const os=osTotal(s.sku);
    const cover=(rq+os)/s.monthly;return{s,oh,blk,wh,pr,rq,os,cover};}).filter(r=>!S.short||r.cover<1.5);

    <select id="cat" aria-label="카테고리"><option value="">전체 카테고리</option>${['립','베이스','아이','치크','스킨케어'].map(c=>`<option ${cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="short" ${S.short?'checked':''}> 1.5개월치 미만만</label>
    <span class="sp"></span><span class="pill info">국내 07:12 수신 · 08:30 검증</span><span class="pill warn">UAE 어제 기준</span>
  </div>
  <div class="tw tall"><table><thead><tr><th>SKU</th><th>품명</th><th class="n">국내 실물</th><th class="n">품질보류·할당</th><th class="n">보류(WMS)</th><th class="n">내부 예약</th><th class="n">요청 가능</th><th class="n">해외 합계</th><th>판매 여유</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="clickable ${sel===r.s.sku?'sel':''}" data-sku="${r.s.sku}"><td class="mono">${r.s.sku}</td><td>${esc(r.s.name)}</td>
  <td class="n"><button class="lin" data-lin="oh|${r.s.sku}">${fmt(r.oh)}</button></td><td class="n">${fmt(r.blk)}</td><td class="n"><button class="lin" data-lin="wh|${r.s.sku}">${fmt(r.wh)}</button></td>
  <td class="n">${r.pr?`<button class="lin" data-lin="pr|${r.s.sku}">${fmt(r.pr)}</button>`:'0'}</td><td class="n"><b>${fmt(r.rq)}</b></td>
  <td class="n"><button class="lin" data-lin="os|${r.s.sku}">${fmt(r.os)}</button></td><td>${pill(r.cover.toFixed(1)+'개월치',r.cover<1?'bad':r.cover<1.5?'warn':'good')}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">조건에 맞는 SKU가 없습니다</td></tr>'}
  </tbody></table></div>
  ${sel?skuDetail(sel):'<p class="muted" style="margin-top:12px">행을 누르면 로트별 유효기간과 보류 내역이 아래에 열립니다.</p>'}`;
};

  <div><b>해외 3PL</b> <span class="muted">로트·유효기간 미제공</span><div class="tw" style="margin-top:6px"><table><thead><tr><th>국가</th><th class="n">수량</th><th>기준</th></tr></thead><tbody>
  ${S.countries.map(C=>`<tr><td>${C.n}</td><td class="n">${fmt(S.osStock[C.c][k]||0)}</td><td>${S.osStale[C.c]?pill('어제 기준','warn'):pill('오늘 07시대','good')}</td></tr>`).join('')}</tbody></table></div>
  <p class="muted" style="margin:8px 0 0">월 예측 ${fmt(s.fcDom+s.fcOs+s.fcBm)}개 · MOQ ${fmt(s.moq)} · OEM 리드타임 ${s.lt}주</p></div></div></div>`;}

      <div class="row"><button class="primary" id="cutBtn">${S.nextCut} 마감 실행</button><button id="reflectBtn" ${sent?'':'disabled'}>WMS 반영 확인 (다음 파일 수신)</button></div>

function lineage(kind,sku){let html='';
  if(kind==='oh'||kind==='wh'){const L=S.lots.filter(l=>l.sku===sku);
    html=`<p>국내 3PL 검증본 <span class="mono">KR_WMS_재고_20261109.xlsx</span> · 07:12 수신 · ${S.collectRunAt} 검증</p><div class="tw"><table><thead><tr><th>파일 행</th><th>로트</th><th class="n">${kind==='oh'?'실물':'WMS 보류'}</th></tr></thead><tbody>${L.map(l=>`<tr><td class="mono">${l.row}행</td><td class="mono">${l.lot}</td><td class="n">${fmt(kind==='oh'?l.onhand:l.wmsHold)}</td></tr>`).join('')}</tbody></table></div>`;
    if(kind==='wh'){const rs=S.res.filter(r=>r.sku===sku&&r.status==='반영확인');html+=`<p class="muted" style="margin-top:10px">${rs.length?'이 수량을 만든 보류: '+rs.map(r=>`${r.id} ${fmt(r.qty)}개`).join(', '):'반영된 보류 없음'}</p>`;}}
  if(kind==='pr'){const rs=S.res.filter(r=>r.sku===sku&&PENDING.includes(r.status));
    html=`<p>아직 WMS에 반영되지 않은 내부 예약입니다.</p><div class="tw"><table><thead><tr><th>번호</th><th class="n">수량</th><th>상태</th><th>요청</th></tr></thead><tbody>${rs.map(r=>`<tr><td class="mono">${r.id}</td><td class="n">${fmt(r.qty)}</td><td>${stPill(r.status)}</td><td>${esc(r.by)} · ${r.at}</td></tr>`).join('')}</tbody></table></div>`;}
  if(kind==='os'){html=`<p>해외 3PL은 SKU별 수량만 줍니다. 로트·유효기간은 미제공으로 둡니다.</p><div class="tw"><table><thead><tr><th>국가</th><th>파일 · 행</th><th class="n">반영 수량</th><th>비고</th></tr></thead><tbody>${S.countries.map(C=>{const r=S.osRaw[C.c].find(x=>x.sku===sku);if(!r)return'';
      const note=S.osStale[C.c]?pill('어제 검증본','warn'):r.qty<0?pill('음수 → 격리, 어제 값','bad'):sku===S.usDrop&&C.c==='US'?pill('급감 경고','warn'):'';

  modal(`${sku} · 숫자 근거`,html);}
function holdAvailText(){const k=($('#hSku')||{}).value;const el=$('#hAvail');if(!el)return;if(!S.skuMap[k]){el.textContent='등록된 SKU가 아닙니다';return;}el.innerHTML=`${esc(S.skuMap[k].name)} · 지금 요청 가능 <b class="mono">${fmt(requestable(k))}</b>개`;}

V.ship=()=>{
  const res=S.orders.map(o=>({o,r:checkOrder(o)}));const cnt=t=>res.filter(x=>x.r.status===t).length;
  const short=S.lots.filter(l=>lotAvail(l)>0&&mLeft(l.exp)<12).sort((a,b)=>a.exp-b.exp);

V.channel=()=>{
  const kr=sum(S.lots,l=>l.onhand*(l.cost??S.skuMap[l.sku].cost));

  const nonDirect=S.channels.filter(c=>c.type!=='직매입');const chv=sum(nonDirect,c=>c.est*S.avgCost);const tot=kr+os+chv;
  const w=v=>(v/tot*100).toFixed(1);
  return `<h1>L4 채널 재고·자산</h1>
  <p class="lead">채널로 보낸 수량 − 채널 판매(정산서) = 추정 채널 재고. 특정매입·위탁·플랫폼 센터 재고는 팔리기 전까지 회사 자산이고, 직매입은 납품 시 소유권이 넘어갑니다. 채널이 재고를 보고하면 매월 대조해 기말 실사 전에 차이를 찾습니다.</p>
  <div class="card"><div class="row" style="margin-bottom:8px"><b>회사 자산 재고 (원가 기준)</b><span class="sp"></span><b class="mono">${won(tot)}</b></div>
  <div class="bar"><div style="flex:${w(kr)};background:var(--accent);color:#fff">국내 창고 ${w(kr)}%</div><div style="flex:${w(os)};background:var(--teal);color:#fff">해외 3PL ${w(os)}%</div><div style="flex:${w(chv)};background:var(--warn-soft);color:var(--warn)">채널 보관 ${w(chv)}%</div></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>국내 ${won(kr)}</span><span><i style="background:var(--teal)"></i>해외 ${won(os)}</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>채널 ${won(chv)} (평균 원가 ${fmt(S.avgCost)}원 적용)</span></div></div>
  <div class="tw" style="margin-top:14px"><table><thead><tr><th>채널</th><th>거래유형</th><th class="n">90일 출고</th><th class="n">90일 판매</th><th class="n">추정 재고</th><th class="n">채널 보고</th><th>대조</th><th class="n">자산 금액</th></tr></thead><tbody>
  ${S.channels.map(c=>c.type==='직매입'?`<tr><td>${esc(c.name)}</td><td>${pill(c.type,'mute')}</td><td class="n">${fmt(c.ship90)}</td><td colspan="5" class="muted">납품 시 소유권 이전 → 회사 자산 아님</td></tr>`:
  `<tr><td>${esc(c.name)}</td><td>${pill(c.type,'acc')}</td><td class="n">${fmt(c.ship90)}</td><td class="n">${fmt(c.sold90)}</td><td class="n"><b>${fmt(c.est)}</b></td><td class="n">${c.reported==null?'—':fmt(c.reported)}</td><td>${c.reported==null?pill('보고 없음 → 분기 실사','mute'):c.diff?pill(`차이 ${c.diff}`,'bad'):pill('일치','good')}</td><td class="n">${won(c.est*S.avgCost)}</td></tr>`).join('')}

/* ---------- 라우팅·이벤트 ---------- */
function render(){
  const v=(location.hash||'#home').slice(1);const view=V[v]?v:'home';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('#clock').textContent=`2026-11-09 ${S.clock} 기준`;
  $('#view').innerHTML=V[view]();
  if(view==='hold'){holdAvailText();$('#hSku').addEventListener('input',holdAvailText);}
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
$('#resetBtn').onclick=()=>{gen();render();toast('처음 상태로 되돌렸습니다');};
const go=v=>{if(location.hash==='#'+v)render();else location.hash=v;};

document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='cat'){S.cat=e.target.value;render();}
  if(e.target.id==='short'){S.short=e.target.checked;render();}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='holdForm')return;e.preventDefault();
  const sku=$('#hSku').value.trim(),qty=+$('#hQty').value;
  if(!S.skuMap[sku]){toast('등록된 SKU를 고르세요');return;}
  if(!(qty>0)){toast('수량을 입력하세요');return;}
  const r=reserve({sku,qty,ch:$('#hCh').value,purpose:$('#hPur').value||'—',end:$('#hEnd').value||'—',urgent:$('#hUrg').checked,by:'국내영업'});
  S.holdSku=sku;render();
  toast(r.ok?`${r.id} 예약 확정. 요청 가능 수량이 ${fmt(requestable(sku)+qty)} → ${fmt(requestable(sku))}개로 바로 줄었습니다`:`요청 가능 수량은 ${fmt(r.avail)}개입니다. ${fmt(r.avail)}개 이하로 요청하거나 다른 색상·로트를 확인하세요`);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr.clickable');if(!t)return;const d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.done){S.done[d.done]=!S.done[d.done];render();return;}
  if(d.lin){e.stopPropagation();lineage(...d.lin.split('|'));return;}
  if(d.hold){S.holdSku=d.hold;go('hold');return;}
  if(t.matches('tr.clickable')){S.sel=S.sel===d.sku?null:d.sku;render();return;}
  if(d.map){const[code,sku]=d.map.split('|');S.codeMap[code]=sku;S.history.unshift({at:'2026-11-09',item:'상품코드 매핑 · H&B 체인 A',change:`${code} → ${sku}`,by:'국내영업',src:'10월 매입 확정서'});render();toast(`매핑을 확정했습니다. 다음 달부터 ${code}는 자동으로 ${sku}로 바뀝니다`);return;}
  if(d.approve){const r=S.res.find(x=>x.id===d.approve);r.status='전송완료';r.sent='긴급 건별';r.note='야간 작업비 발생 (금액: [₩__])';S.batches.push({id:'U-'+r.id,at:S.clock+' 긴급',n:1,list:[r]});render();toast(`${r.id} 비용 승인 후 3PL에 건별로 보냈습니다`);return;}
  if(d.release){const r=S.res.find(x=>x.id===d.release);let n=r.qty;S.lots.filter(l=>l.sku===r.sku).forEach(l=>{const t2=Math.min(n,l.wmsHold);l.wmsHold-=t2;n-=t2;});r.status='해제';render();toast(`${r.id} 해제. ${fmt(r.qty)}개가 다시 요청 가능해졌습니다`);return;}
  if(d.cancel){const r=S.res.find(x=>x.id===d.cancel);r.status='해제';r.note='3PL 전송 전 취소';render();toast(`${r.id} 취소. 3PL에는 보내지 않았습니다`);return;}
  if(d.batch){const b=S.batches.find(x=>x.id===d.batch);modal(`3PL 보류 지시 파일 · ${b.id}`,`<p class="muted">시연 화면에서는 파일 다운로드 대신 내용을 보여줍니다. 실제로는 3PL 양식 엑셀로 내려받습니다.</p>`,batchCSV(b.list));return;}
  switch(t.id){
    case 'runCol':{const el=$('#colProg');el.hidden=false;const steps=['국내 3PL WMS 파일 내려받기 (크롬 확장)','해외 3PL 파일 4개 수신 확인, UAE 미수신','형식 검증: 필수 컬럼·자료형','의미 검증: 미등록 SKU·음수 행 격리','업무 검증: 전일 대비 급변·미수신 경고','검증본 저장 → 전사 재고 갱신'];let i=0;el.innerHTML='';
      const tick=()=>{if(i<steps.length){el.insertAdjacentHTML('beforeend',`<div>✓ ${steps[i]}</div>`);i++;setTimeout(tick,350);}else{runCollect();S.collectRunAt=S.clock;setTimeout(()=>{render();toast('수집·검증 완료. 격리 2행, 경고 2건은 예외 처리함으로 보냈습니다');},300);}};tick();break;}
    case 'cutBtn':{const list=S.res.filter(r=>r.status==='예약확정');const id=`B-1109-${S.nextCut.slice(0,2)}`;
      if(!list.length){toast('이번 마감에 보낼 보류가 없습니다');S.clock=S.nextCut;S.nextCut=S.nextCut==='11:00'?'16:00':'내일 11:00';render();break;}
      list.forEach(r=>{r.status='전송완료';r.sent=id;});S.batches.push({id,at:S.nextCut,n:list.length,list});S.clock=S.nextCut;S.nextCut=S.nextCut==='11:00'?'16:00':'내일 11:00';render();
      modal(`3PL 보류 지시 파일 · ${id}`,`<p>${list.length}건을 한 번에 보냅니다. 건별 처리 대비 야간 작업 없음.</p>`,batchCSV(list));break;}
    case 'reflectBtn':{const list=S.res.filter(r=>r.status==='전송완료');const before=Object.fromEntries(list.map(r=>[r.sku,requestable(r.sku)]));
      list.forEach(r=>{applyWmsHold(r.sku,r.qty);r.status='반영확인';});render();
      const sk=list[0].sku;toast(`WMS 반영 ${list.length}건 확인. 예: ${sk} 요청 가능 ${fmt(before[sk])} → ${fmt(requestable(sk))}개, 그대로라 이중 차감이 없습니다`);break;}
    case 'raceBtn':{const sku=($('#hSku')||{}).value&&S.skuMap[$('#hSku').value]?$('#hSku').value:'DD-LG-01';const r0=requestable(sku);
      if(r0<20){toast('이 SKU는 요청 가능 수량이 너무 적습니다. 다른 SKU를 고르세요');break;}
      const a=Math.ceil(r0*.7/10)*10,b=Math.ceil(r0*.6/10)*10;
      const ra=reserve({sku,qty:a,ch:'CH05',purpose:'동시 요청 시연 A',end:'2026-12-15',urgent:false,by:'국내영업 담당 A'});
      const rb=reserve({sku,qty:b,ch:'CH09',purpose:'동시 요청 시연 B',end:'2026-12-15',urgent:false,by:'해외팀 담당 B'});
      if(!rb.ok)S.res.push({id:'H-'+(++S.seq),sku,qty:b,ch:'CH09',purpose:'동시 요청 시연 B',end:'2026-12-15',urgent:false,status:'반려',at:S.clock,by:'해외팀 담당 B',note:`남은 ${fmt(rb.avail)}개까지 부분 예약 가능`});
      render();modal('동시 요청 시연',`<div class="stack"><p><b>${sku}</b> 요청 가능 ${fmt(r0)}개에 두 사람이 같은 시각에 요청했습니다.</p>
      <div class="issue">${stPill(ra.ok?'예약확정':'반려')}<span>국내영업 담당 A · ${fmt(a)}개 → ${ra.ok?ra.id+' 확정':'반려'}</span></div>
      <div class="issue">${stPill(rb.ok?'예약확정':'반려')}<span>해외팀 담당 B · ${fmt(b)}개 → ${rb.ok?rb.id+' 확정':`반려. 남은 ${fmt(rb.avail)}개까지 부분 예약을 제안`}</span></div>
      <p class="muted">잔여 확인과 예약을 한 번에 처리하므로 같은 물량이 두 번 잡히지 않습니다. 엑셀 공유 파일에서는 둘 다 잡혔다고 생각하게 되는 상황입니다.</p></div>`);break;}
    case 'shipCSV':{const rows=[['지시번호','채널','SKU','품명','수량','지정로트','비고']];S.orders.forEach(o=>{const r=checkOrder(o);const s=S.skuMap[o.sku];
      if(r.status==='통과')rows.push([o.no,chName(o.ch),o.sku,s.name,o.qty,'(FEFO)','']);
      else if(r.status==='로트 지정')r.alt.forEach(p=>rows.push([o.no,chName(o.ch),o.sku,s.name,p.qty,p.lot.lot,`채널 규정 ${S.chMap[o.ch].rule}개월 이상`]));
      else rows.push([o.no,chName(o.ch),o.sku,s.name,0,'','보류: '+r.reason]);});
      modal('3PL 출고 지시서 (로트 지정 포함)','<p class="muted">로트 지정 건은 FEFO 대신 지정 로트로 피킹하도록 3PL에 보냅니다.</p>',toCSV(rows));break;}
    case 'pkgBtn':{const rows=[['채널','거래유형','10월 출고수량','매출인식수량','매출액(추정)','기말 회사자산(원가)','근거']];S.channels.forEach(c=>{const q=c.type==='직매입'?c.shipOct:c.soldOct;rows.push([c.name,c.type,c.shipOct,q,q*c.price,c.type==='직매입'?'':Math.round(c.est*S.avgCost),c.type==='직매입'?'출고증빙·매입확정서':'정산서·L4 추정']);});
      modal('10월 마감 근거 묶음','<p class="muted">매출결의 첨부 양식 그대로 나갑니다. 크롬 확장(A3)이 이 값으로 그룹웨어 양식 칸을 채우고, 제출은 사람이 누릅니다.</p>',toCSV(rows));break;}
    case 'costReq':{const rows=[['로트','SKU','품명','제조일','입고수량','임시원가 제안','요청']];S.lots.filter(l=>l.cost==null).forEach(l=>{const s=S.skuMap[l.sku];rows.push([l.lot,l.sku,s.name,fmtD(l.mfg),l.onhand,s.cost,'확정 원가 회신 요청 (기한 11/14)']);});
      modal('구매 원가 확정 요청 목록','',toCSV(rows));break;}
  }
});

gen();render();
</script>
